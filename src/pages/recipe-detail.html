  <main id="main" class="page__content">

    <section class="page-header">
      <div class="container">
        <nav aria-label="Breadcrumb" style="margin-bottom:var(--space-4)">
          <a href="/recipes.html" style="color:var(--text-secondary);font-size:var(--text-sm)">&larr; All Recipes</a>
        </nav>
        <h1 class="page-header__title" id="recipe-title">Loading...</h1>
        <p class="page-header__desc" id="recipe-desc"></p>
      </div>
    </section>

    <section class="section section--white">
      <div class="container container--md">
        <div id="recipe-meta" class="recipe-meta"></div>
        <img id="recipe-image" class="mb-8" style="border-radius:var(--radius-xl);width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--color-wheat-light)" alt="" loading="lazy">

        <div class="prose">
          <h2>Ingredients</h2>
          <ul id="recipe-ingredients"></ul>

          <h2>Instructions</h2>
          <ol id="recipe-steps"></ol>

          <div id="recipe-tips"></div>
        </div>

        <div class="text-center mt-8">
          <a href="/recipes.html" class="btn btn--outline">Back to All Recipes</a>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer__bottom">
        <p>&copy; 2026 Knead &amp; Bake TX. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module">
    import ContentLoader from '/src/js/content-loader.js';
    import { initNav } from '/src/js/nav.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initNav();

      // Get slug from URL: /recipes/beginner-sourdough-loaf.html -> beginner-sourdough-loaf
      const path = window.location.pathname;
      const slug = path.split('/').pop().replace('.html', '');

      const data = await ContentLoader.recipes();
      if (!data?.recipes) return;

      const recipe = data.recipes.find(r => r.slug === slug);
      if (!recipe) {
        document.getElementById('recipe-title').textContent = 'Recipe Not Found';
        return;
      }

      // Update page
      document.title = `${recipe.title} | Knead & Bake TX`;
      document.getElementById('recipe-title').textContent = recipe.title;
      document.getElementById('recipe-desc').textContent = recipe.description;

      // Meta
      document.getElementById('recipe-meta').innerHTML = `
        <span class="recipe-meta__item"><strong>Prep:</strong>&nbsp;${recipe.prepTime}</span>
        <span class="recipe-meta__item"><strong>Rest:</strong>&nbsp;${recipe.restTime}</span>
        <span class="recipe-meta__item"><strong>Bake:</strong>&nbsp;${recipe.bakeTime}</span>
        <span class="recipe-meta__item"><strong>Yields:</strong>&nbsp;${recipe.yields}</span>
        <span class="recipe-meta__item"><strong>Difficulty:</strong>&nbsp;${recipe.difficulty}</span>
      `;

      // Image
      const img = document.getElementById('recipe-image');
      if (recipe.image) {
        img.src = recipe.image;
        img.alt = recipe.title;
      } else {
        img.style.display = 'none';
      }

      // Ingredients
      document.getElementById('recipe-ingredients').innerHTML =
        recipe.ingredients.map(i => `<li>${i}</li>`).join('');

      // Steps — support bold markdown
      document.getElementById('recipe-steps').innerHTML =
        recipe.steps.map(s => `<li>${s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</li>`).join('');

      // Tips
      if (recipe.tips?.length) {
        document.getElementById('recipe-tips').innerHTML = `
          <h2>Tips</h2>
          <ul>${recipe.tips.map(t => `<li>${t}</li>`).join('')}</ul>
        `;
      }
    });
  </script>

</body>
</html>
